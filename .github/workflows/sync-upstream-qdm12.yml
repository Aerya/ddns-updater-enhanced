name: Sync upstream qdm12/ddns-updater

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PR_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Clone qdm12 upstream into temp dir
        run: |
          git clone --depth=1 https://github.com/qdm12/ddns-updater.git /tmp/upstream-qdm12

      - name: Sync files from upstream (excluding our own overrides)
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='readme/' \
            --exclude='go.mod' \
            --exclude='go.sum' \
            --exclude='cmd/ddns-updater/main.go' \
            --exclude='internal/data/memory.go' \
            --exclude='internal/data/memory_test.go' \
            --exclude='internal/params/webui.go' \
            --exclude='internal/server/' \
            --exclude='internal/provider/fielddefs.go' \
            --exclude='internal/provider/fielddefs_test.go' \
            /tmp/upstream-qdm12/ ./

      - name: Patch docker-compose and Dockerfile to keep Aerya branding
        run: |
          sed -i \
            -e 's|org.opencontainers.image.authors="quentin.mcgaw@gmail.com"|org.opencontainers.image.authors="Aerya"|g' \
            -e 's|org.opencontainers.image.url="https://github.com/qdm12/ddns-updater"|org.opencontainers.image.url="https://github.com/Aerya/ddns-updater-enhanced"|g' \
            -e 's|org.opencontainers.image.documentation="https://github.com/qdm12/ddns-updater"|org.opencontainers.image.documentation="https://github.com/Aerya/ddns-updater-enhanced"|g' \
            -e 's|org.opencontainers.image.source="https://github.com/qdm12/ddns-updater"|org.opencontainers.image.source="https://github.com/Aerya/ddns-updater-enhanced"|g' \
            -e 's|org.opencontainers.image.title="ddns-updater"|org.opencontainers.image.title="ddns-updater-enhanced"|g' \
            -e 's|org.opencontainers.image.description="Universal DNS updater with WebUI"|org.opencontainers.image.description="DDNS-Updater Enhanced — based on qdm12/ddns-updater and reptil1990/ddns-updater"|g' \
            -e 's|SHOUTRRR_DEFAULT_TITLE="DDNS Updater"|SHOUTRRR_DEFAULT_TITLE="DDNS-Updater Enhanced"|g' \
            Dockerfile
          sed -i \
            -e 's|image: ghcr.io/qdm12/ddns-updater|image: ghcr.io/aerya/ddns-updater-enhanced|g' \
            -e 's|image: ghcr.io/aerya/ddns-updater$|image: ghcr.io/aerya/ddns-updater-enhanced|g' \
            -e 's|container_name: ddns-updater$|container_name: ddns-updater-enhanced|g' \
            docker-compose.yml

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get upstream commit info
        if: steps.check.outputs.changed == 'true'
        id: upstream
        run: |
          SHA=$(git -C /tmp/upstream-qdm12 rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create sync branch and commit
        if: steps.check.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="sync/qdm12"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync from qdm12/ddns-updater@${{ steps.upstream.outputs.sha }} ($(date +%Y-%m-%d))"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push or refresh persistent branch
        if: steps.check.outputs.changed == 'true'
        run: git push --force origin "HEAD:${{ steps.branch.outputs.branch }}"

      - name: Create or refresh PR and enable auto-merge
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          TITLE="Synchroniser avec qdm12/ddns-updater ($(date +%Y-%m-%d))"
          BODY="Synchronisation automatique des fichiers depuis [qdm12/ddns-updater](https://github.com/qdm12/ddns-updater), commit \`${{ steps.upstream.outputs.sha }}\`.

          Fichiers exclus de la synchronisation afin de conserver les adaptations locales :
          - \`.github/\` (workflows du dépôt)
          - \`README.md\` et \`readme/\` (documentation et captures locales)
          - \`go.mod\` et \`go.sum\` (dépendances gérées par Dependabot)
          - \`cmd/ddns-updater/main.go\`, \`internal/data/memory.go\`, \`internal/data/memory_test.go\`, \`internal/params/webui.go\`, \`internal/server/\`, \`internal/provider/fielddefs.go\` et \`internal/provider/fielddefs_test.go\` (couche WebUI locale)

          Cette PR sera fusionnée automatiquement après validation de tous les contrôles."
          PR_NUMBER=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH")
            PR_NUMBER="${PR_URL##*/}"
          else
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          fi
          gh pr merge --auto --squash --subject "$TITLE" "$PR_NUMBER"

      - name: No changes detected
        if: steps.check.outputs.changed == 'false'
        run: echo "No changes from qdm12/ddns-updater. Nothing to do."
