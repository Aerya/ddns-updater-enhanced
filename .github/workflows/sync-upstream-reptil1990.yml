name: Sync upstream reptil1990/ddns-updater

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PR_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Clone reptil1990 upstream into temp dir
        run: |
          git clone --depth=1 https://github.com/reptil1990/ddns-updater.git /tmp/upstream-reptil1990

      - name: Sync WebUI files from upstream (internal/server/ only)
        run: |
          rsync -av --delete \
            --exclude='api.go' \
            --exclude='api_test.go' \
            --exclude='handler.go' \
            /tmp/upstream-reptil1990/internal/server/ ./internal/server/

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get upstream commit info
        if: steps.check.outputs.changed == 'true'
        id: upstream
        run: |
          SHA=$(git -C /tmp/upstream-reptil1990 rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create sync branch and commit
        if: steps.check.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="sync/reptil1990"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync from reptil1990/ddns-updater@${{ steps.upstream.outputs.sha }} ($(date +%Y-%m-%d))"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push or refresh persistent branch
        if: steps.check.outputs.changed == 'true'
        run: git push --force origin "HEAD:${{ steps.branch.outputs.branch }}"

      - name: Create or refresh PR and enable auto-merge
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          TITLE="Synchroniser avec reptil1990/ddns-updater ($(date +%Y-%m-%d))"
          BODY="Synchronisation automatique de la WebUI depuis [reptil1990/ddns-updater](https://github.com/reptil1990/ddns-updater), commit \`${{ steps.upstream.outputs.sha }}\`.

          Fichiers exclus de la synchronisation afin de conserver les adaptations locales :
          - \`internal/server/api.go\` et \`internal/server/api_test.go\` (API locale)
          - \`internal/server/handler.go\` (configuration locale sécurisée sans \`middleware.RealIP\`)

          Cette PR sera fusionnée automatiquement après validation de tous les contrôles."
          PR_NUMBER=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH")
            PR_NUMBER="${PR_URL##*/}"
          else
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          fi
          gh pr merge --auto --squash --subject "$TITLE" "$PR_NUMBER"

      - name: No changes detected
        if: steps.check.outputs.changed == 'false'
        run: echo "No changes from reptil1990/ddns-updater. Nothing to do."
